# ICCP on Docker. The backend jar and the web app are built on the host first (see README or
# C:\dev\iccp-docker-up.ps1), so Docker only downloads small runtime images.
#   Everything (database, backend, web app, mail viewer):
#     docker compose -f infra\docker-compose.yml --env-file infra\.env up -d --build
#   Then open http://localhost:8090, or the port set as ICCP_WEB_PORT in .env  (Mailpit: http://localhost:8025)
#   Add Keycloak and MinIO with:  --profile sso
# Host ports avoid a PostgreSQL (5432) or another app (8080) already on the machine, and stay below 49152:
# Windows reserves blocks of the higher ports for Hyper-V/WSL, so binding e.g. 55432 can fail with
# "access permissions". PostgreSQL is published on 127.0.0.1 only.
name: iccp

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ICCP_OWNER_PASSWORD: ${ICCP_OWNER_PASSWORD}
      ICCP_APP_PASSWORD: ${ICCP_APP_PASSWORD}
      ICCP_RETENTION_PASSWORD: ${ICCP_RETENTION_PASSWORD}
      ICCP_REPORT_PASSWORD: ${ICCP_REPORT_PASSWORD}
      ICCP_AUDITOR_PASSWORD: ${ICCP_AUDITOR_PASSWORD}
      TZ: Africa/Dar_es_Salaam
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/01-iccp-roles.sh:/docker-entrypoint-initdb.d/01-iccp-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iccp"]
      interval: 5s
      retries: 30

  backend:
    build: ../backend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${ICCP_PROFILES:-dev,demo}
      ICCP_DB_URL: jdbc:postgresql://postgres:5432/iccp
      ICCP_APP_PASSWORD: ${ICCP_APP_PASSWORD}
      ICCP_OWNER_PASSWORD: ${ICCP_OWNER_PASSWORD}
      ICCP_PUBLIC_URL: http://localhost:${ICCP_WEB_PORT:-8090}
      ICCP_ALLOWED_ORIGINS: http://localhost:${ICCP_WEB_PORT:-8090}
      ICCP_AUTH_MODE: ${ICCP_AUTH_MODE:-dev}
      ICCP_OIDC_ISSUER: ${ICCP_OIDC_ISSUER:-http://localhost:8180/realms/tirdo}
      ICCP_OIDC_JWK_SET_URI: ${ICCP_OIDC_JWK_SET_URI:-http://host.docker.internal:8180/realms/tirdo/protocol/openid-connect/certs}
      ICCP_DEV_SECRET: ${ICCP_DEV_SECRET}
      ICCP_FILE_STORE: minio
      ICCP_MINIO_ENDPOINT: http://minio:9000
      ICCP_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      ICCP_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ICCP_MINIO_BUCKET: ${ICCP_MINIO_BUCKET:-iccp}
      ICCP_MAX_UPLOAD_BYTES: ${ICCP_MAX_UPLOAD_BYTES:-20971520}
      ICCP_FILE_SCAN_PROVIDER: clamav
      ICCP_CLAMAV_HOST: clamav
      ICCP_CLAMAV_PORT: "3310"
      ICCP_SCAN_MAX_ATTEMPTS: ${ICCP_SCAN_MAX_ATTEMPTS:-3}
      ICCP_SMTP_HOST: mailpit
      ICCP_SMTP_PORT: "1025"
      ICCP_EMAIL_ENABLED: "true"
      ICCP_SMS_PROVIDER: ${ICCP_SMS_PROVIDER:-log}
      ICCP_SMS_URL: ${ICCP_SMS_URL:-}
      ICCP_SMS_API_KEY: ${ICCP_SMS_API_KEY:-}
      ICCP_SMS_SENDER_ID: ${ICCP_SMS_SENDER_ID:-TIRDO}
      ICCP_SMS_CONNECT_TIMEOUT_MS: ${ICCP_SMS_CONNECT_TIMEOUT_MS:-5000}
      ICCP_SMS_READ_TIMEOUT_MS: ${ICCP_SMS_READ_TIMEOUT_MS:-10000}
      ICCP_INTEGRATIONS_MMS_SYNC_SECRET: ${ICCP_MMS_SYNC_SECRET:-local-iccp-mms-sync-2026}

  web:
    build: ../frontend
    depends_on: [backend]
    ports: ["${ICCP_WEB_PORT:-8090}:80"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]

  keycloak:
    profiles: ["sso"]
    image: quay.io/keycloak/keycloak:26.5.7
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_PORT: 8080
    ports: ["8180:8080"]
    volumes:
      - ./keycloak/tirdo-realm.json:/opt/keycloak/data/import/tirdo-realm.json:ro

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamdata:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1"]
      interval: 10s
      timeout: 5s
      retries: 30
volumes:
  pgdata:
  files:
  miniodata:
  clamdata:
