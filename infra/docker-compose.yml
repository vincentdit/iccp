# Supporting services for local development and demos.
# Start:  docker compose --env-file .env up -d        (copy .env.example to .env first)
# The backend and the Angular app run on the host (see README) so they reload as you edit.
name: iccp

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ICCP_OWNER_PASSWORD: ${ICCP_OWNER_PASSWORD}
      ICCP_APP_PASSWORD: ${ICCP_APP_PASSWORD}
      ICCP_RETENTION_PASSWORD: ${ICCP_RETENTION_PASSWORD}
      ICCP_REPORT_PASSWORD: ${ICCP_REPORT_PASSWORD}
      ICCP_AUDITOR_PASSWORD: ${ICCP_AUDITOR_PASSWORD}
      TZ: Africa/Dar_es_Salaam
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/01-iccp-roles.sh:/docker-entrypoint-initdb.d/01-iccp-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iccp"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_PORT: 8080
    ports: ["8180:8080"]
    volumes:
      - ./keycloak/tirdo-realm.json:/opt/keycloak/data/import/tirdo-realm.json:ro

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:v1.20
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  miniodata:
