# ICCP on Docker. The backend jar and the web app are built on the host first (see README or
# C:\dev\iccp-docker-up.ps1), so Docker only downloads small runtime images.
#   Everything (database, backend, web app, mail viewer):
#     docker compose -f infra\docker-compose.yml --env-file infra\.env up -d --build
#   Then open http://localhost:8090  (Mailpit: http://localhost:8025)
#   Add Keycloak and MinIO with:  --profile sso
# Host ports avoid a PostgreSQL (5432) or another app (8080) already on the machine, and stay below 49152:
# Windows reserves blocks of the higher ports for Hyper-V/WSL, so binding e.g. 55432 can fail with
# "access permissions". PostgreSQL is published on 127.0.0.1 only.
name: iccp

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ICCP_OWNER_PASSWORD: ${ICCP_OWNER_PASSWORD}
      ICCP_APP_PASSWORD: ${ICCP_APP_PASSWORD}
      ICCP_RETENTION_PASSWORD: ${ICCP_RETENTION_PASSWORD}
      ICCP_REPORT_PASSWORD: ${ICCP_REPORT_PASSWORD}
      ICCP_AUDITOR_PASSWORD: ${ICCP_AUDITOR_PASSWORD}
      TZ: Africa/Dar_es_Salaam
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/01-iccp-roles.sh:/docker-entrypoint-initdb.d/01-iccp-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iccp"]
      interval: 5s
      retries: 30

  backend:
    build: ../backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${ICCP_PROFILES:-dev,demo}
      ICCP_DB_URL: jdbc:postgresql://postgres:5432/iccp
      ICCP_APP_PASSWORD: ${ICCP_APP_PASSWORD}
      ICCP_OWNER_PASSWORD: ${ICCP_OWNER_PASSWORD}
      ICCP_PUBLIC_URL: http://localhost:8090
      ICCP_ALLOWED_ORIGINS: http://localhost:8090
      ICCP_DEV_SECRET: ${ICCP_DEV_SECRET}
      ICCP_FILE_DIR: /app/var/files
      ICCP_SMTP_HOST: mailpit
      ICCP_SMTP_PORT: "1025"
      ICCP_EMAIL_ENABLED: "true"
    volumes:
      - files:/app/var/files

  web:
    build: ../frontend
    depends_on: [backend]
    ports: ["8090:80"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]

  keycloak:
    profiles: ["sso"]
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_PORT: 8080
    ports: ["8180:8080"]
    volumes:
      - ./keycloak/tirdo-realm.json:/opt/keycloak/data/import/tirdo-realm.json:ro

  minio:
    profiles: ["sso"]
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  files:
  miniodata:
